display_name: GLClash
package_name: GLClash
maintainer:
  name: GuLiang-I
  email: guliang-i@users.noreply.github.com

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libayatana-appindicator3-1
  - libsecret-1-0

# The Helper unit is written on demand by the app, not at install time, so only
# its teardown belongs here; the binary is already gone when postrm runs.
postuninstall_scripts:
  - 'case "${1:-}" in remove|purge) ;; *) exit 0 ;; esac'
  - 'systemctl disable --now glclash-helper.service >/dev/null 2>&1 || true'
  - 'rm -f /etc/systemd/system/glclash-helper.service'
  - 'systemctl daemon-reload >/dev/null 2>&1 || true'

supported_mime_type:
  - x-scheme-handler/clash
  - x-scheme-handler/clashmeta
  - x-scheme-handler/glclash

keywords:
  - GLClash
  - Clash
  - ClashMeta
  - Proxy

generic_name: GLClash

categories:
  - Network

startup_notify: true

startup_wm_class: com.glclash.app
